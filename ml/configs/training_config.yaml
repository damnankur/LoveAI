# QLoRA Fine-tuning Configuration (small model, 4GB-VRAM friendly)

## Model
- Base: Qwen/Qwen2.5-1.5B-Instruct
- Quantization: 4-bit (bitsandbytes, QLoRA)
- Precision: bfloat16

## Training (SFT)
- Epochs: 3
- Learning Rate: 2e-4
- Batch Size: 1 (per device)
- Gradient Accumulation: 8
- Max Sequence Length: 1024

## LoRA Parameters
- Rank: 16
- Alpha: 32
- Dropout: 0.05
- Target Modules: q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj

## Datasets
- Synthetic persona-chat SFT pairs (generated by ml/datasets/build_dataset.py)
- Synthetic persona DPO preference pairs for emotional alignment

## Notes
- GTX 1650 Ti (4 GB VRAM): Qwen2.5-1.5B QLoRA fits with bf16 + 4-bit base.
- Cloud alternative for bigger models: AWS EC2 g5.xlarge / rented VPS.
