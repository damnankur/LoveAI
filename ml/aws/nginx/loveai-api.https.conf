# loveAI persona API — TLS server block (installed by loveai-setup-tls.sh once the
# Let's Encrypt certificate exists).
#
# Security posture:
#   * The only public listener is nginx on 443 (and 80 for ACME + redirect).
#   * The model server binds 127.0.0.1:8000 and is never exposed by the security
#     group, so port 8000 is unreachable from the internet even if iptables/SG drift.
#   * Auth is the shared secret checked by the model server (--api-key-file for
#     llama-server, LLM_API_KEY for serve.py), not by nginx: that keeps one source
#     of truth and lets us rotate the key by restarting one service.
upstream loveai_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name __API_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name __API_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__API_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_HOST__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__API_HOST__/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:loveai_ssl:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/loveai-api.access.log;
    error_log  /var/log/nginx/loveai-api.error.log warn;

    client_max_body_size 2m;

    # Unauthenticated liveness probe (nginx → model server /health).
    location = /health {
        proxy_pass         http://loveai_api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    location /v1/ {
        proxy_pass         http://loveai_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        # Streaming-safe: no response buffering, so SSE chunks pass straight through
        # (llm.ts uses non-streaming today, but this keeps the door open).
        proxy_buffering    off;
        proxy_cache        off;
        # CPU inference is slow — see loveai-api.http.conf for the measured numbers.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
    }

    location /metrics {
        # Prometheus metrics from llama-server; keep internal.
        allow 127.0.0.1;
        deny all;
        proxy_pass http://loveai_api/metrics;
    }

    location / {
        return 404;
    }
}
