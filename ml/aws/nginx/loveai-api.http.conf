# loveAI persona API — plain HTTP server block (pre-TLS / bootstrap state).
#
# Installed to /etc/nginx/conf.d/loveai-api.conf by user-data.sh, and re-installed by
# loveai-setup-tls.sh right before the ACME challenge is solved. It is replaced by
# loveai-api.https.conf once the certificate exists.
#
# It proxies (does NOT redirect to https) so that the endpoint is testable with curl
# over HTTP the moment the instance boots — the HTTPS redirect only appears in the
# post-TLS block, where a 443 listener actually exists.
upstream loveai_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name __API_HOST__;

    # Certbot webroot challenge (must stay reachable over plain HTTP).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    access_log /var/log/nginx/loveai-api.access.log;
    error_log  /var/log/nginx/loveai-api.error.log warn;

    client_max_body_size 2m;

    location / {
        proxy_pass         http://loveai_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        # CPU inference is slow: a 1000-token prompt + 220 generated tokens was
        # measured at ~26 s on 2 x86 threads, so budget generously (Vercel Hobby
        # functions may run 300 s).
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
    }
}
